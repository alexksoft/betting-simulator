<div class="auth-container">
  <div class="auth-card">
    <h2>🎯 Betting Simulator</h2>
    <h3>Sign In</h3>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••" />
      </div>
      <button type="submit" [disabled]="loading" class="btn btn-primary btn-full">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-link">No account? <a routerLink="/auth/register">Register</a></p>
  </div>
</div>
