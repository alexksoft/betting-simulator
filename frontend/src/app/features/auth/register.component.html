<div class="auth-container">
  <div class="auth-card">
    <h2>🎯 Betting Simulator</h2>
    <h3>Create Account</h3>
    <p class="subtitle">Start with £1,000 virtual bankroll</p>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" required placeholder="punter123" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Min 6 characters" />
      </div>
      <button type="submit" [disabled]="loading" class="btn btn-primary btn-full">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-link">Already have an account? <a routerLink="/auth/login">Sign in</a></p>
  </div>
</div>
