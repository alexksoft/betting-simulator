spring.application.name=betting-simulator

# JWT
jwt.secret=betting-simulator-secret-key-change-in-production-min-256-bits
jwt.expiration=86400000

# DynamoDB
aws.region=us-east-1
aws.dynamodb.endpoint=
# Leave endpoint empty for production; set to http://localhost:8000 for local DynamoDB

# Initial bankroll for new users
app.initial.bankroll=1000.00

# RSS Odds Feed (example: The Odds API RSS or similar)
app.odds.rss.url=https://www.espn.com/espn/rss/
app.odds.refresh.cron=0 */30 * * * *

# Logging
logging.level.com.bettingsim=DEBUG
logging.level.software.amazon.awssdk=WARN

# Disable Spring Boot banner for Lambda cold start
spring.main.banner-mode=off
spring.main.lazy-initialization=true
